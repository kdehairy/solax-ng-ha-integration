name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'custom_components/**/*.py'
      - 'custom_components/**/manifest.json'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'scripts/**/*.py'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'custom_components/**/*.py'
      - 'custom_components/**/manifest.json'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'scripts/**/*.py'
      - '.github/workflows/*.yml'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Sync dependencies
      run: uv sync --python ${{ matrix.python-version }}
    - name: Check manifest matches pyproject.toml
      run: uv run python scripts/check_manifest_consistency.py
    - name: Check code style with black
      run: |
        uv run black --check .
    - name: Check types with mypy
      run: |
        uv run mypy .
    - name: Check imports with isort
      run: |
        uv run isort --check-only --profile black .
    - name: Lint with flake8
      run: |
        uv run flake8 --ignore=E501,E704 custom_components tests
    - name: Lint with pylint
      run: |
        uv run pylint -d 'C0111' custom_components tests
    - name: Test with pytest
      run: |
        uv run pytest --cov=custom_components.solax --cov-branch --cov-report=term-missing .
        mv .coverage .coverage.${{ matrix.python-version }}
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: .coverage-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        if-no-files-found: error
        include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Download coverage files
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Coverage combine
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade coverage
        coverage combine
        coverage report -m --fail-under=100

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
    - name: HACS validation
      uses: "hacs/action@main"
      with:
        category: "integration"

  release:
    needs: [coverage, validate-hacs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
